{% extends "base.html" %}
{% block title %}거래 채팅{% endblock %}
{% block content %}
<section class="page-header">
  <h2>거래 채팅</h2>
  <p>메시지는 저장되지 않으며 페이지를 새로고침하면 사라집니다.</p>
</section>

<section class="surface">
  <ul class="detail-list">
    <li><strong>상품</strong><span>{{ product.title }}</span></li>
    <li><strong>거래 상태</strong><span class="badge badge-{{ trade.status|lower }}">{{ trade.status }}</span></li>
    <li><strong>상대방</strong><span>{{ counterpart.username if counterpart else '알 수 없음' }}</span></li>
  </ul>
  <p><a href="{{ url_for('trades') }}">← 거래 내역으로 돌아가기</a></p>

  <div class="chat-panel">
    <div id="chat-messages" class="chat-messages">
      <p id="chat-notice" class="chat-notice">메시지가 없습니다. 채팅을 시작해 보세요.</p>
    </div>
    <p id="chat-error" class="chat-error"></p>
    <form id="chat-form" class="chat-form" autocomplete="off">
      <label class="muted" for="chat-input">메시지</label>
      <input
        type="text"
        id="chat-input"
        placeholder="메시지를 입력하세요 (최대 500자)"
        maxlength="500"
      >
      <button type="submit">전송</button>
    </form>
  </div>
</section>

<script>
  // trade_id는 서버에서 렌더링 — 클라이언트가 수정할 수 없음
  var TRADE_ID = {{ trade_id | tojson }};

  var socket = io();

  var messagesDiv = document.getElementById('chat-messages');
  var chatNotice = document.getElementById('chat-notice');
  var chatError  = document.getElementById('chat-error');
  var chatInput  = document.getElementById('chat-input');
  var chatForm   = document.getElementById('chat-form');

  socket.on('connect', function () {
    socket.emit('join_trade_chat', { trade_id: TRADE_ID });
  });

  socket.on('chat_joined', function (data) {
    var notice = document.createElement('p');
    notice.textContent = data.message || '채팅방에 입장했습니다.';
    notice.className = 'chat-notice';
    if (chatNotice) {
      chatNotice.remove();
      chatNotice = null;
    }
    messagesDiv.appendChild(notice);
  });

  socket.on('chat_message', function (data) {
    if (chatNotice) {
      chatNotice.remove();
      chatNotice = null;
    }
    var item = document.createElement('div');
    item.className = 'chat-message';

    var meta = document.createElement('small');
    meta.textContent = '[' + (data.sent_at || '') + '] ' + (data.sender_username || '알 수 없음') + ': ';

    var text = document.createElement('span');
    text.textContent = data.message || '';

    item.appendChild(meta);
    item.appendChild(text);
    messagesDiv.appendChild(item);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  });

  socket.on('chat_error', function (data) {
    chatError.style.display = 'block';
    chatError.textContent = data.message || '오류가 발생했습니다.';
  });

  chatForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var msg = chatInput.value;
    socket.emit('send_trade_message', { trade_id: TRADE_ID, message: msg });
    chatInput.value = '';
  });

  window.addEventListener('beforeunload', function () {
    socket.emit('leave_trade_chat', { trade_id: TRADE_ID });
  });
</script>
{% endblock %}
