{% extends "base.html" %}
{% block title %}문의 작성{% endblock %}
{% block content %}
<section class="page-header">
  <h2>문의 작성</h2>
  <p>개인 문의는 고객지원 영역에만 저장되며 신고 내역과 분리됩니다.</p>
</section>

<section class="surface">
  <form method="post" action="{{ url_for('support_new') }}" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label for="category">카테고리</label>
      <select id="category" name="category" required>
        <option value="">-- 선택하세요 --</option>
        {% for category in categories %}
        <option value="{{ category }}">{{ category }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="title">제목</label>
      <input type="text" id="title" name="title" maxlength="120" required>
    </div>
    <div>
      <label for="content">문의 내용</label>
      <textarea id="content" name="content" rows="8" maxlength="2000" required></textarea>
    </div>
    <div class="form-actions">
      <button type="submit">문의 접수</button>
      <a class="button button-secondary" href="{{ url_for('support_list') }}">문의 목록으로 돌아가기</a>
    </div>
  </form>
</section>
{% endblock %}
