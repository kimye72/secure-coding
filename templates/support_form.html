{% extends "base.html" %}
{% block title %}문의 작성{% endblock %}
{% block content %}
<h2>문의 작성</h2>

<form method="post" action="{{ url_for('support_new') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label for="category">카테고리</label>
  <select id="category" name="category" required>
    <option value="">-- 선택하세요 --</option>
    {% for category in categories %}
    <option value="{{ category }}">{{ category }}</option>
    {% endfor %}
  </select>

  <label for="title">제목</label>
  <input type="text" id="title" name="title" maxlength="120" required>

  <label for="content">문의 내용</label>
  <textarea id="content" name="content" rows="8" maxlength="2000" required></textarea>

  <button type="submit">문의 접수</button>
</form>

<p><a href="{{ url_for('support_list') }}">문의 목록으로 돌아가기</a></p>
{% endblock %}
