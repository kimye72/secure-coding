{% extends "base.html" %}
{% block title %}새 상품 등록{% endblock %}
{% block content %}
<section class="page-header">
  <h2>상품 등록</h2>
  <p>사진, 거래 지역, 가격을 입력해 안전하게 상품을 등록하세요.</p>
</section>

<section class="surface">
  <form method="post" action="{{ url_for('new_product') }}" enctype="multipart/form-data" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label for="title">제목</label>
      <input type="text" id="title" name="title" maxlength="100" required>
    </div>
    <div>
      <label for="description">설명</label>
      <textarea id="description" name="description" rows="6" maxlength="2000" required></textarea>
    </div>
    <div>
      <label for="price">가격 (원)</label>
      <input type="number" id="price" name="price" min="1" required>
    </div>
    <div>
      <label for="trade_location">거래 지역 (선택)</label>
      <input type="text" id="trade_location" name="trade_location" maxlength="120" placeholder="예: 대구 수성구">
    </div>
    <div>
      <label for="image">대표 이미지 (선택, JPEG/PNG/WebP, 최대 5 MiB)</label>
      <input type="file" id="image" name="image" accept="image/jpeg,image/png,image/webp">
      <p class="field-hint">이미지는 서버에서 검증한 뒤 상품 UUID 파일명으로 저장됩니다.</p>
    </div>
    <div class="form-actions">
      <button type="submit">등록하기</button>
      <a class="button button-secondary" href="{{ url_for('dashboard') }}">대시보드로 돌아가기</a>
    </div>
  </form>
</section>
{% endblock %}
