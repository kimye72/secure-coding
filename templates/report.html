{% extends "base.html" %}
{% block title %}신고하기{% endblock %}
{% block content %}
<h2>신고하기</h2>
<form method="post" action="{{ url_for('report') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  신고 대상 유형:
  <select name="target_type" required>
    <option value="">-- 선택하세요 --</option>
    <option value="USER" {% if request.args.get('target_type') == 'USER' %}selected{% endif %}>사용자 (USER)</option>
    <option value="PRODUCT" {% if request.args.get('target_type') == 'PRODUCT' %}selected{% endif %}>상품 (PRODUCT)</option>
  </select><br>
  신고 대상 (사용자ID 또는 상품ID): <input type="text" name="target_id" value="{{ request.args.get('target_id', '') }}" required><br>
  신고 사유: <br>
  <textarea name="reason" rows="4" cols="50" maxlength="1000" required></textarea><br>
  <button type="submit">신고 접수</button>
</form>
{% endblock %}
