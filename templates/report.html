{% extends "base.html" %}
{% block title %}신고하기{% endblock %}
{% block content %}
<section class="page-header">
  <h2>신고하기</h2>
  <p>부적절한 사용자 또는 상품을 운영자에게 신고합니다.</p>
</section>

<section class="surface">
  <form method="post" action="{{ url_for('report') }}" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label for="target_type">신고 대상 유형</label>
      <select id="target_type" name="target_type" required>
        <option value="">-- 선택하세요 --</option>
        <option value="USER" {% if request.args.get('target_type') == 'USER' %}selected{% endif %}>사용자 (USER)</option>
        <option value="PRODUCT" {% if request.args.get('target_type') == 'PRODUCT' %}selected{% endif %}>상품 (PRODUCT)</option>
      </select>
    </div>
    <div>
      <label for="target_id">신고 대상 (사용자ID 또는 상품ID)</label>
      <input type="text" id="target_id" name="target_id" value="{{ request.args.get('target_id', '') }}" required>
    </div>
    <div>
      <label for="reason">신고 사유</label>
      <textarea id="reason" name="reason" rows="4" maxlength="1000" required></textarea>
    </div>
    <button type="submit" class="button-warning">신고 접수</button>
  </form>
</section>
{% endblock %}
